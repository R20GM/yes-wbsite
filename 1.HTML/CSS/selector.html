<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selector</title>
    <style>
        /* Selector by element/tag */
        p {
            color:blue
        }

        /* Selector by class */
        .highlight {
            background-color: yellow
        }

        /* selector by id */
        #unique {
            font-weight: bold;
        }

        /* Universal selector */
        * {
            margin: 10;
            padding: 0;
        }
    </style>
</head>
<body>
    
</body>
</html>
