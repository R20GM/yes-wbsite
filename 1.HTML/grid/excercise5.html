<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <style>
        .characters{
            display: grid; /*menggunakan atau menggaktifkan*/
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }
        .card{
            background: aliceblue;
            padding: 20px;
            border: 1px solid navy;
        }
        @media (max-width: 600px) {
            .characters {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="characters">
        <div class="card">character 1</div>
        <div class="card">character 2</div>
        <div class="card">character 3</div>
        <div class="card">character 4</div>
        <div class="card">character 5</div>
        <div class="card">character 6</div>
        <div class="card">character 7</div>
        <div class="card">character 8</div>
    </div>
</body>
</html>
