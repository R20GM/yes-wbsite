<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display:flex; /*untuk mengaktifkan flexbox*/
            justify-content: space-between;
            padding-right: 650px;

        }
        .logo{
            color: aquamarine;
        }
        .menu{
            display:flex; /*untuk mengaktifkan flexbox*/
            gap:20px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <p>LOGO</p>
        </div>
        <div class="menu">
            <p>HOME</p>
            <p>ABOUT</p>
            <p>CONTACT</p>
        </div>
    </div> 
</body>
</html>
