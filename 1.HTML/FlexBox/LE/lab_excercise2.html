<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            display:flex; /*untuk mengaktifkan flexbox*/
            justify-content: space-between;
            padding-right: 650px;

        }
        .product{
            display:flex;
            color: maroon;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            background-color: aliceblue;
            flex: 1;
            min-width: 200px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="product">
            <div class="item">[Product 1]</div>
            <div class="item">[Product 2]</div>
            <div class="item">[Product 3]</div>
        </div>
    </div> 
</body>
</html>
