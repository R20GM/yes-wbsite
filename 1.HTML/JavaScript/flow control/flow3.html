<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript: while Loop</title>
</head>
<body>
    <script>
        let count = 1;
        while (count <= 10){
            console.log("current count: " + count);
            count++;
        }
    </script>
</body>
</html>
