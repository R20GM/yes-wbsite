<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> math grade calculator</title>
</head>
<body>
    <script>
        input = parseInt(prompt(' nilai: '));
        if(input >= 90){
            alert("Excellent");
        } else if (input >= 75){
            alert("Good");
        } else if (input >= 60){
            alert("Pass");
        } else {
            alert("Try again");
        }
    </script>
</body>
</html>
