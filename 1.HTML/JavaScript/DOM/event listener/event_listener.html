<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        #myButton{
            padding: 10 px 20px;
            font-size: 10px;
            cursor: pointer;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <button id="myButton">Klik saya</button>
    <script>
        document.getElementById("myButton").addEventListener("click", function(){
            alert("Tombol diklik!");
        })
    </script>
</body>
</html>
