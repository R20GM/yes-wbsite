<!DOCTYPE html>
<html lang="en">
<head>
    <title>Test Enter</title>
</head>
<body>
    
    <h3> Tekan tombol Enter di mana saja</h3>
<script>
    document.addEventListener("keydown", function(event){
        if (event.key==="Enter") {
            alert("Anda menekan Enter");
        }
    })
</script>
</body>
</html>
