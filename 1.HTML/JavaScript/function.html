<html lang="eng">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fungsi</title>
</head>
<body>
    <script>
        //function declaration -> bagian kita kenalkan fungsi
        function hello(){
            alert('Hello, '+name+'!');
        }
        
        function tambah(a,b){
            return a+b
        }

        //function call ->bagian kita panggil fungsi
        name = prompt('Masukkan nama Anda:')
        hello();

        console.log(tambah(2,3))

    </script>
</body>
