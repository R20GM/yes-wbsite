<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function evenOrOdd(number){
            if (number %2 === 0){
                return true;
            } else {
                return false;
            }
        }
        num = parseInt(prompt('Masukkan sebuah angka:'))

        if (evenOrOdd(num)){
            alert(num+ 'adalah angka genap.');
        } else {
            alert(num+ 'adalah angka ganjil')
        }
    </script>
</body>
</html>
