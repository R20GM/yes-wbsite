<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> math grade calculator</title>
</head>
<body>
    <script>
        weather = prompt(' whats the weather?: ');
        if(weather == "rainy"){
            alert("stay at home");
        } else if (weather == "sunny"){
            alert("Go outside");
        } else if (weather == "cloudy"){
            alert("Bring and umbrella");
        } else {
            alert("unknown weather");
        }
    </script>
</body>
</html>
