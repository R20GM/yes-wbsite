<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secret game club password</title>
</head>
<body>
    <script>
        let secret = 7;
        let guess = parseInt(prompt('Enter your guess: '));
        while (guess !== secret){
            alert('Try again!');
            guess = parseInt(prompt('Enter your guess:'));
        }
    alert('correct!')
    </script>
