<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> math grade calculator</title>
</head>
<body>
    <script>
        lightcolor = prompt(' light color: ');
        if(lightcolor == "red"){
            alert("stop");
        } else if (lightcolor == "yellow"){
            alert("Get Ready");
        } else if (lightcolor == "green"){
            alert("Go");
        } else {
            alert("Try Invalid color");
        }
    </script>
</body>
</html>
