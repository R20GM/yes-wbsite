<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secret game club password</title>
</head>
<body>
    <script>
        password = 'dragon';
        let count = 0;

        while (count <3){
            input = prompt(' password?: ');
        if(input == password){
            alert("access granted!");
            break;
        } else{
            alert("access denied!")
        }
        count++;
    }
    </script>
</body>
</html>
