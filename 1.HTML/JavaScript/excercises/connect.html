<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <!-- Inline JS: langsung dalam tag-->
    <button onclick="alert('hello there!')">click me!</button>

    <!-- internal JS : ada di file yg sama -->
    <script>
        coba = prompt(' Masukkan Nama Anda: ');
        alert('Halo' + coba + ', Selamat Datang di Dunia JavaScript')
        
    </script>

    <!-- external JS-->
     <script src="script.js"></script>
</body>
</html>
